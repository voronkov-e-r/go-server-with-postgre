version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: bookapi
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookapi
    ports:
      - "5432:5432"
    volumes:
      - bookapi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookapi-pgdata: